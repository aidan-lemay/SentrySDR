#!/usr/sbin/nft -f
# Default-deny inbound firewall. SentrySDR itself needs NO inbound ports: it listens on
# loopback only, and slaves listen on nothing. Review this before loading it, and keep
# a console or second session open: a mistake here can lock you out of a remote server.
#
# Delete the "master behind Caddy/nginx" line when using cloudflared or a slave:
# both only make outbound connections.

table inet sentrysdr_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept

        # SSH: restrict to your admin network or tailnet if you can.
        tcp dport 22 accept

        # Tailscale's own transport, if used.
        udp dport 41641 accept
        iifname "tailscale0" accept

        # master behind Caddy/nginx:
        tcp dport { 80, 443 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
