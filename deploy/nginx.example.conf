# Pair with: trusted_proxies = ["127.0.0.1/32", "::1/128"], client_ip_header = "X-Forwarded-For"
#
# To serve under a sub-path instead, use "location /sdr/ { proxy_pass http://127.0.0.1:8642/; ... }"
# and set server.public_url = "https://sentry.example.com/sdr".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentry.example.com;

    ssl_certificate     /etc/letsencrypt/live/sentry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentry.example.com/privkey.pem;

    # Slaves upload finished calls, which may be up to 30 minutes of audio.
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live audio is an endless response; slave links are long-lived websockets.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sentry.example.com;
    return 301 https://$host$request_uri;
}
