# systemd-tmpfiles: raise the kernel's USB buffer memory limit at every boot.
# Every RTL-SDR on a machine shares this limit, 16 MB by default, and each running stick
# uses about 4 MB, so with four or more the last tool to start fails with "lost device".
# 256 MB is plenty for a dozen sticks and still a limit. Installed to /etc/tmpfiles.d/.
w /sys/module/usbcore/parameters/usbfs_memory_mb - - - - 256
