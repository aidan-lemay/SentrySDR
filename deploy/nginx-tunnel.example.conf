# cloudflared -> nginx on another machine -> SentrySDR master.
# Cloudflare handles HTTPS, so nginx listens on plain http for the tunnel.
#
# Master's configuration:
#   [server]
#   bind_host = "0.0.0.0"
#   local_access = true
#   public_url = "https://sentry.example.com"
#   [proxy]
#   trusted_proxies = ["<address nginx connects from>/32"]
#   client_ip_header = "CF-Connecting-IP"
server {
    listen 80;
    server_name sentry.example.com;

    # Slaves upload finished calls through here. The nginx default of 1 MB would
    # refuse any call longer than about 4 minutes.
    client_max_body_size 256m;

    location / {
        # No path after the port: SentrySDR serves from its root.
        proxy_pass http://192.168.1.20:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Slave links are long-lived websockets, and live audio is an endless response.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
