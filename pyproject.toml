[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrysdr"
version = "0.1.0"
description = "Self-hosted SDR call recorder with a PWA, master/slave nodes and scheduled recording"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sentrysdr = "sentrysdr.__main__:main"

[tool.setuptools.packages.find]
include = ["sentrysdr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
